name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline. The practice model and the fake client do not use a network
      # or an API key. Do not add a step that calls a live model.
      - name: Run tests
        run: python -m pytest -q

      - name: Reproduce the public incident baseline
        run: python evaluation.py --check

      - name: Reproduce the synthetic investigation challenge
        run: python investigation_eval.py --check
